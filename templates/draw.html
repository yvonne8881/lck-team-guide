<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LCK 選手抽卡</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      background: #101119;
      color: #f4f4f6;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    main {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    h1 {
      margin: 24px 0 12px;
      color: #f2c66d;
      font-size: clamp(36px, 6vw, 58px);
    }

    .subtitle {
      margin: 0 0 30px;
      color: #c5c6ce;
      font-size: 20px;
    }

    .draw-panel {
      padding: 30px 20px;
      border: 1px solid #5b4b2c;
      border-radius: 22px;
      background: linear-gradient(135deg, #24212a, #1b1e29);
    }

    .card-scene {
      width: min(78vw, 340px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 28px;
      perspective: 1200px;
    }

    .player-card,
    .card-inner,
    .card-face {
      width: 100%;
      height: 100%;
    }

    .player-card {
      position: relative;
      border-radius: 20px;
      filter: drop-shadow(0 18px 24px rgb(0 0 0 / 45%));
    }

    .card-inner {
      position: relative;
      transform-style: preserve-3d;
    }

    .card-face {
      position: absolute;
      inset: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: transparent;
      border-radius: 20px;
      background: transparent;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }

    .card-back img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 19px;
    }

    .card-front {
      transform: rotateY(180deg);
      padding: 20px;
      background:
        radial-gradient(ellipse at top, rgb(242 198 109 / 17%), transparent 60%),
        #151620;
    }

    .player-photo {
      width: 48%;
      height: 58%;
      object-fit: cover;
      border: 2px solid #d3b36d;
      border-radius: 14px;
      background: #252936;
    }

    .player-team {
      margin: 12px 0 6px;
      color: #f2c66d;
      font-size: 15px;
      font-weight: bold;
    }

    .player-name {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .lane-icon {
      width: 26px;
      height: 26px;
      object-fit: contain;
    }

    .player-name h2 {
      margin: 0;
      color: #f4f4f6;
      font-size: 22px;
      overflow-wrap: anywhere;
    }

    .player-position {
      margin: 6px 0 0;
      color: #c5c6ce;
      font-size: 14px;
    }

    .team-link {
      margin-top: 10px;
      color: #f2c66d;
      font-size: 14px;
      text-decoration: none;
    }

    .team-link:hover {
      text-decoration: underline;
    }

    /* 抽到選手後旋轉，最後停在正面 */
    .player-card.is-flipped .card-inner {
  animation: reveal-card 1.2s ease-out forwards;
}

@keyframes reveal-card {
  from {
    transform: rotateY(0deg);
  }

  to {
    transform: rotateY(900deg);
  }
}


    .draw-button,
    .teams-button {
      display: inline-block;
      border-radius: 999px;
      font-size: 17px;
      font-weight: bold;
      text-decoration: none;
      cursor: pointer;
    }

    .draw-button {
      padding: 15px 34px;
      border: 0;
      background: #f2c66d;
      color: #171717;
    }

    .draw-button:hover {
      background: #ffdc8a;
      transform: translateY(-1px);
    }

    .teams-button {
      margin-top: 24px;
      padding: 15px 34px;
      border: 1px solid #454a5a;
      background: #292d3a;
      color: #f4f4f6;
    }

    .teams-button:hover {
      background: #383d4d;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 14px;
      }

      .draw-panel {
        padding: 24px 14px;
      }

      .player-card.is-flipped .card-inner {
        animation-duration: 1.2s;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .player-card.is-flipped .card-inner {
        animation-duration: 0.2s;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>LCK 選手抽卡</h1>
    <p class="subtitle">今天想要了解哪一位選手呢？</p>

    <section class="draw-panel">
      <div class="card-scene">
        <div class="player-card {% if drawn_player %}is-flipped{% endif %}">
          <div class="card-inner">
            <div class="card-face card-back">
              <img src="{{ card_back_url }}" alt="神秘 LCK 選手卡卡背">
            </div>

            <div class="card-face card-front">
              {% if drawn_player %}
                <img
                  class="player-photo"
                  src="{{ drawn_player.photo_url }}"
                  alt="{{ drawn_player.name }}"
                >

                <p class="player-team">{{ drawn_player.team }}</p>

                <div class="player-name">
                  <img
                    class="lane-icon"
                    src="{{ drawn_player.lane_url }}"
                    alt="{{ drawn_player.position_label }}"
                    title="{{ drawn_player.position_label }}"
                  >
                  <h2>{{ drawn_player.name }}</h2>
                </div>

                <p class="player-position">{{ drawn_player.position_label }}</p>

                <a
                  class="team-link"
                  href="{{ url_for('team_detail', slug=drawn_player.team_slug) }}"
                >
                  查看隊伍介紹 →
                </a>
              {% endif %}
            </div>
          </div>
        </div>
      </div>

      <form method="post">
        <button class="draw-button" type="submit">
          {% if drawn_player %}重抽{% else %}抽一位選手{% endif %}
        </button>
      </form>
    </section>

    <a class="teams-button" href="{{ url_for('home') }}">
      點此看更多 LCK 隊伍介紹
    </a>
  </main>
</body>
</html>
